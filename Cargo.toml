[workspace]
resolver = "2"
members = [
    "crates/qshard-core",
    "crates/qchain-protocol",
    "crates/qchain-registry",
    "apps/qchain",
    "apps/qchain-node",
    "apps/qchain-blue",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["therealsylva"]
license = "MIT"
repository = "https://github.com/therealsylva/Qshard"
rust-version = "1.85"

[workspace.dependencies]
actix-web = { version = "4.11", features = ["rustls-0_23"] }
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
bytes = "1.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
openraft = { version = "=0.9.21", features = ["serde"] }
dashmap = "6.1"
openraft-sledstore = "=0.9.21"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7.4"
rustls = "0.23"
rustls-pemfile = "2.2"
rustyline = "17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sharks = "0.5"
shell-words = "1.1"
sled = "0.34"
subtle = "2.6"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"
uuid = { version = "1.17", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
result_large_err = "allow"
unused_async_trait_impl = "allow"
